name: 美团去广告
description: 移除美团首页底栏视频/小团 tab、推荐流、个人页交叉推荐、搜索热词、AI 技能、购物车横幅与开屏图，需清缓存或重装生效。
author: ZenmoFeiShi, Sliverkiss
homepage: https://github.com/Sliverkiss/egern
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/c1/16/65/c1166517-71bb-d29d-d36e-516765f8a537/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-85-220.png/104x104bb.jpg
# merged from:
#   ZenmoFeiShi/Qx MT.snippet + MT.js (2026-10-25 / 2026-11-21) — 规则与脚本主体
#   Sliverkiss/egern modules/meituan-ads.yaml — 增强型 JQ 类型守卫与完整 MITM 补全
# absorption:
#   1. TLS 连接前规则层（46 条）：shark 追踪、mquic 探测、HttpDNS 域名与 IP 级直连拦截（含 IPv6 规整与 no_resolve）
#   2. URL 重写层（2 条）：HttpDNS 正则阻断与 fetch 直连拦截
#   3. 正文重写层（8 处）：原 MT.js 140 行脚本全量降阶为零脚本、零额外网络请求的高性能 response_jq，严格保留 homepage/mine 保底断言与类型守卫
#   4. MITM（9 处）：补全 httpdns 全量 HTTPS 域名，确保加密流量拦截不遗漏

